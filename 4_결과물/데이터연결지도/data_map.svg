<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 674" width="1680" height="674" font-family="'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="40" y="48" font-size="26" font-weight="700" fill="#1F2933">강원 웰니스관광 진단 · 데이터는 이렇게 연결된다</text>
<text x="40" y="76" font-size="15" fill="#6B7280">다섯 가지 공공데이터를 시·군·기간·좌표로 엮어 지표를 만들고, 가설 다섯 개를 확인해 결론 세 개를 얻었다. 굵은 선은 핵심 메시지로 가는 길.</text>
<text x="40" y="98" font-size="16" font-weight="700" fill="#2D6A8E">① 데이터<tspan font-weight="400" fill="#9AA3AE" font-size="13">  어디서 가져왔나</tspan></text>
<text x="360" y="98" font-size="16" font-weight="700" fill="#6B7280">② 연결<tspan font-weight="400" fill="#9AA3AE" font-size="13">  어떻게 붙였나</tspan></text>
<text x="660" y="98" font-size="16" font-weight="700" fill="#6B7280">③ 지표<tspan font-weight="400" fill="#9AA3AE" font-size="13">  무엇을 쟀나</tspan></text>
<text x="970" y="98" font-size="16" font-weight="700" fill="#B7791F">④ 가설<tspan font-weight="400" fill="#9AA3AE" font-size="13">  무엇을 확인했나</tspan></text>
<text x="1310" y="98" font-size="16" font-weight="700" fill="#C8553D">⑤ 결론<tspan font-weight="400" fill="#9AA3AE" font-size="13">  그래서 무엇을 말하나</tspan></text>
